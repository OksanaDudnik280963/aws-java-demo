spring:
  application:
    name: aws-java-demo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awsdemo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    aws:
      region:
        static: ${AWS_REGION:eu-west-2}
      # No static credentials and no endpoint overrides here on purpose:
      # on ECS/EC2/Lambda the default provider chain picks up the IAM role.
      # LocalStack settings live in application-local.yml (profile "local").

app:
  s3:
    bucket: ${S3_BUCKET:order-attachments}
  sqs:
    order-queue: ${SQS_ORDER_QUEUE:order-events-queue}
