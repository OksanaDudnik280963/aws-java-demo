spring:
  application:
    name: aws-java-demo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awsdemo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    aws:
      region:
        static: ${AWS_REGION:eu-west-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY:test}
        secret-key: ${AWS_SECRET_KEY:test}
      # Point everything at the LocalStack edge port for local dev via docker-compose.
      # Leave AWS_ENDPOINT unset (or override per-service) when deploying against real AWS.
      s3:
        endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
        path-style-access-enabled: true
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}

app:
  s3:
    bucket: ${S3_BUCKET:order-attachments}
  sqs:
    order-queue: ${SQS_ORDER_QUEUE:order-events-queue}
